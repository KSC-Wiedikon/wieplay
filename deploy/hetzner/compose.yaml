# WiePlay API on the Hetzner VPS, one directory per environment (/opt/wieplay-dev, /opt/wieplay-prod)
# holding this file and a .env (template: deploy/hetzner/env.example). scripts/deploy.sh
# copies it there and runs: docker compose up -d
services:
  api:
    image: wieplay-api:${WIEPLAY_TAG:?WIEPLAY_TAG must be set in .env}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${WIEPLAY_PORT:?WIEPLAY_PORT must be set in .env}:8000"
      # Unused since 16.10.2026: the VPS is on no tailnet and WIEPLAY_TAILNET_IP is unset, so
      # this binds 127.0.0.2 (loopback only). Workers reach the API through an SSH tunnel to
      # 127.0.0.1 (deploy/lenovo/wieplay-api-tunnel.service, PLAN §8.1).
      - "${WIEPLAY_TAILNET_IP:-127.0.0.2}:${WIEPLAY_PORT}:8000"
    networks: [kscw]
    # The VPS also runs prod Directus: WiePlay stays small.
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  kscw:
    # The Docker network that reaches kscw-postgres and the Directus containers.
    external: true
    name: ${WIEPLAY_DOCKER_NETWORK:-coolify}
