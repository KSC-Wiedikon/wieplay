name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nomal
          POSTGRES_PASSWORD: nomal
          POSTGRES_DB: nomal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nomal" --health-interval 2s --health-retries 30
    env:
      NOMAL_TEST_DATABASE_URL: postgresql+psycopg://nomal:nomal@127.0.0.1:5432/nomal_test
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg (the worker tests encode a tiny clip)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nomal-api:ci .
      - run: docker build -f Dockerfile.worker -t nomal-worker:ci .
