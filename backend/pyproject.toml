[project]
name = "wieplay"
version = "0.1.0"
description = "WiePlay: video analysis for KSC Wiedikon"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.114",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    # Scoresheet photos (PLAN §10.3a, SS3): decoded, checked and re-encoded by the API.
    "pillow>=11.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]==2026.8.19",
]

[project.optional-dependencies]
analysis = [
    "numpy>=2.3",
    "opencv-python-headless==4.14.0.94",
    "onnxruntime>=1.22",
    "scikit-learn>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wieplay"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]
# ffmpeg/ffprobe from PATH with argument lists, never a shell.
"wieplay/worker/ffmpeg.py" = ["S603", "S607"]
"tests/test_worker_ffmpeg.py" = ["S603", "S607"]
"tests/test_worker_analyse.py" = ["S603", "S607"]
"tests/test_worker_recap.py" = ["S603", "S607"]
"tests/test_scoreboard_ml.py" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["wieplay"]

[[tool.mypy.overrides]]
# The analysis extra ships no type information.
module = ["onnxruntime", "onnxruntime.*", "scipy.*", "sklearn", "sklearn.*", "threadpoolctl"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "wieplay[analysis]",
    "boto3-stubs[s3]>=1.43.114",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
