# Local development only: Postgres for the API and its tests, and an S3 server for videos.
#   docker compose up -d        (stop: docker compose down; wipe: docker compose down -v)
# SeaweedFS stands in for Hetzner Object Storage (MinIO no longer ships images). Its keys
# are local-only and live in deploy/local/seaweedfs-s3.json.
name: wieplay-local

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wieplay
      POSTGRES_PASSWORD: wieplay
      POSTGRES_DB: wieplay
    ports:
      - "127.0.0.1:55488:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wieplay"]
      interval: 2s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - "127.0.0.1:55490:8333"
    volumes:
      - ./deploy/local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - s3:/data

volumes:
  db:
  s3:
